<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="miAlerta" class="alert alert-success d-none" role="alert">
        ¡Excelente! Has activado la alerta correctamente.
    </div>
    <br>
    <button id="activateAlert" class="btn btn-primary" onclick="mostrarAlerta()">
        Activar Alerta
    </button>

    <script>
        function mostrarAlerta(){
            const alerta = document.getElementById('miAlerta');
            alerta.classList.remove('d-none');
        }
    </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
